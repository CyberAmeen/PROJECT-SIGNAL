# Generated by sentinel-import from the live Worker. Secrets (SERPER_API_KEY) stay in Cloudflare and are never stored here.
name = "project-signal-sentinel"
main = "src/worker.js"
compatibility_date = "2026-11-26"

workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "SENTINEL_KV"
id = "583fb75aa30c45a4990a205e87b37e93"


# Staging copy for testing before "launch". Separate Worker, same KV namespace,
# but every key it writes starts with "staging:" so live data is never touched.
[env.staging]
name = "project-signal-sentinel-staging"
workers_dev = true
vars = { KEY_PREFIX = "staging:" }

[env.staging.triggers]
crons = ["*/10 * * * *"]

[[env.staging.kv_namespaces]]
binding = "SENTINEL_KV"
id = "583fb75aa30c45a4990a205e87b37e93"
