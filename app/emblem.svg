<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#0e4a37"/>
      <stop offset=".42" stop-color="#05231a"/>
      <stop offset="1" stop-color="#010607"/>
    </radialGradient>
    <radialGradient id="neb" cx="82%" cy="88%" r="55%">
      <stop offset="0" stop-color="#7d5cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7d5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="12%" cy="8%" r="45%">
      <stop offset="0" stop-color="#3dffb2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3dffb2" stop-opacity="0"/>
    </radialGradient>
    <!-- planet body: lit from the upper left -->
    <radialGradient id="pl" cx="32%" cy="26%" r="82%">
      <stop offset="0" stop-color="#c8ffe9"/>
      <stop offset=".14" stop-color="#5ff0bb"/>
      <stop offset=".40" stop-color="#139a6b"/>
      <stop offset=".6" stop-color="#05402c"/>
      <stop offset=".8" stop-color="#01140e"/>
      <stop offset="1" stop-color="#010d0a"/>
    </radialGradient>
    <linearGradient id="bands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".24" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".38" stop-color="#002a1c" stop-opacity=".22"/>
      <stop offset=".46" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".66" stop-color="#002a1c" stop-opacity=".25"/>
      <stop offset=".76" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset=".86" stop-color="#5dffc0" stop-opacity="0"/>
      <stop offset=".96" stop-color="#5dffc0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5dffc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6fff0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#5dffc0" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#5dffc0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfffe4" stop-opacity="0"/>
      <stop offset=".18" stop-color="#f1fff9" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#7affc8" stop-opacity=".85"/>
      <stop offset=".75" stop-color="#cbbcff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#cbbcff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#2dffaa" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2dffaa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#b9ffe2"/>
      <stop offset="1" stop-color="#3dffb2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pc"><circle cx="560" cy="580" r="244"/></clipPath>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
          <!-- the signal: arcs radiating from a beacon above the planet -->
  <g transform="translate(300 318)" fill="none" stroke-linecap="round">
    <g stroke="#5dffbe" filter="url(#blur8)" opacity=".6">
      <path d="M -70 -10 A 72 72 0 0 1 10 -72" stroke-width="22"/>
      <path d="M -134 -14 A 136 136 0 0 1 14 -136" stroke-width="18"/>
    </g>
    <path d="M -70 -10 A 72 72 0 0 1 10 -72" stroke="#c9ffe8" stroke-width="20"/>
    <path d="M -134 -14 A 136 136 0 0 1 14 -136" stroke="#6dffc4" stroke-width="17" opacity=".85"/>
    <path d="M -200 -18 A 202 202 0 0 1 18 -202" stroke="#3fe8a7" stroke-width="14" opacity=".45"/>
    <circle r="44" fill="url(#dot)"/>
    <circle r="15" fill="#ffffff"/>
  </g>
  <!-- ring, far side -->
  <g transform="rotate(-20 560 580)">
    <ellipse cx="560" cy="580" rx="430" ry="104" fill="none" stroke="url(#ring)" stroke-width="34" opacity=".45"/>
    <ellipse cx="560" cy="580" rx="378" ry="88" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".3"/>
  </g>
  <!-- planet -->
  <circle cx="560" cy="580" r="300" fill="url(#halo)"/>
  <circle cx="560" cy="580" r="244" fill="url(#pl)"/>
  <g clip-path="url(#pc)">
    <rect x="300" y="330" width="520" height="500" fill="url(#bands)" transform="rotate(-20 560 580)"/>
    <ellipse cx="500" cy="440" rx="150" ry="70" fill="#e9fff6" opacity=".16" filter="url(#blur8)" transform="rotate(-20 500 440)"/>
  </g>
  <circle cx="560" cy="580" r="262" fill="url(#atmo)"/>
  <circle cx="560" cy="580" r="244" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <!-- ring, near side (crosses in front of the planet) -->
  <g transform="rotate(-20 560 580)">
    <path d="M 130 580 A 430 104 0 0 0 990 580" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="40" filter="url(#blur8)" transform="translate(0 14)"/>
    <path d="M 130 580 A 430 104 0 0 0 990 580" fill="none" stroke="url(#ring)" stroke-width="34"/>
    <path d="M 182 580 A 378 88 0 0 0 938 580" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".65"/>
    <path d="M 130 580 A 430 104 0 0 0 990 580" fill="none" stroke="#ffffff" stroke-width="4" opacity=".7"/>
  </g>
</svg>
