# THE LONG WATCH — end-to-end checks on a clean runner with real network (Wikimedia images load here):
# frame timing under 4x CPU throttle, heap/DOM after the journey and back, reduced motion, image availability,
# console errors, Atlas hand-off, and journey recordings. Read-only: never deploys. Results go to lw-results.
name: LONG WATCH e2e
on:
  push:
    branches: ["long-watch"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Stage the site exactly as Pages would serve it
        run: |
          mkdir -p _site && rsync -a --exclude '.git' --exclude '.github' --exclude 'sentinel' --exclude 'tools' --exclude '_site' ./ _site/
          node tools/sw-stamp.mjs _site
      - run: pip install playwright==1.49.0 && python -m playwright install ffmpeg && which google-chrome && ffmpeg -version | head -1
      - name: Run
        run: python .github/scripts/lw-e2e.py "$PWD/_site" /tmp/lw
      - name: Publish results to the lw-results branch
        if: always()
        run: |
          cd /tmp/lw && rm -rf vid-* && ls -la
          git init -q r && (cp *.png *.webm lw-results.json r/ 2>/dev/null || true); cd r
          git config user.name "lw-e2e"; git config user.email "actions@users.noreply.github.com"
          git checkout -q -b lw-results && git add -A && git commit -qm "lw e2e ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lw-results
