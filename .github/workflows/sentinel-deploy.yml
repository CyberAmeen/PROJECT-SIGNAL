# Deploys sentinel/ to Cloudflare when SENTINEL changes are merged to main ("launch").
name: SENTINEL deploy to Cloudflare

on:
  push:
    branches: ["main"]
    paths: ["sentinel/**"]
  workflow_dispatch:

concurrency:
  group: sentinel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — only deploy a complete Worker
        run: |
          test -f sentinel/wrangler.toml || { echo "::error::sentinel/wrangler.toml missing"; exit 1; }
          main=$(sed -n 's/^main = "\(.*\)"/\1/p' sentinel/wrangler.toml)
          test -s "sentinel/$main" || { echo "::error::entry module sentinel/$main missing"; exit 1; }
          grep -q 'kv_namespaces' sentinel/wrangler.toml || { echo "::error::KV binding missing from wrangler.toml — refusing to deploy"; exit 1; }
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sentinel
          command: deploy
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: POCKET SIGNAL — create the VAPID key once (kept as a Worker secret, never printed or committed)
        working-directory: sentinel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          list=$(npx --yes wrangler@3 secret list) || { echo "::error::could not list secrets — refusing to touch VAPID_JWK"; exit 1; }
          if printf '%s' "$list" | grep -q '"VAPID_JWK"'; then echo "VAPID_JWK already set — keeping it (existing subscriptions stay valid)"; exit 0; fi
          node ../.github/scripts/vapid-gen.mjs > /tmp/vapid.json
          npx --yes wrangler@3 secret put VAPID_JWK < /tmp/vapid.json > /dev/null; rm -f /tmp/vapid.json
          echo "VAPID_JWK created"
      - name: Verify the live Worker
        run: |
          sleep 15
          curl -s https://project-signal-sentinel.aminhersi10.workers.dev/health; echo
          curl -s -o /dev/null -w "push key HTTP %{http_code}\n" https://project-signal-sentinel.aminhersi10.workers.dev/v1/push/key
