# Pulls the LIVE SENTINEL Worker (code + settings) from Cloudflare into sentinel/ on a review branch.
# Read-only against Cloudflare. Run manually from the Actions tab (or by Claude via the API).
name: SENTINEL import from Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCRIPT: project-signal-sentinel
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are present
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing"; exit 1; }
      - name: Download Worker code and settings
        run: |
          node .github/scripts/sentinel-import.mjs
      - name: Commit to review branch
        run: |
          git config user.name "sentinel-import"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B sentinel-import
          git add sentinel
          git commit -m "SENTINEL: import live Worker from Cloudflare ($(date -u +%Y-%m-%dT%H:%MZ))" || echo "nothing changed"
          git push -f origin sentinel-import
