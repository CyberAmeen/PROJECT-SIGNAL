# Research only (HOOKED): fetch public-domain US government UFO/UAP documents and a public-domain word list. Never deploys.
name: prism-research
on: { push: { branches: [prism-research] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          mkdir -p out/docs && cd out
          get() { curl -sL -A "Mozilla/5.0 (research; Project Signal)" --max-time 120 -o "docs/$1.pdf" "$2"; s=$(stat -c%s "docs/$1.pdf" 2>/dev/null || echo 0); h=$(head -c 5 "docs/$1.pdf" | tr -d '\0'); echo "$1 $s $h $2" >> docs/manifest.txt; if [ "$h" = "%PDF-" ]; then pdftotext -layout "docs/$1.pdf" "docs/$1.txt" || true; pdfinfo "docs/$1.pdf" | grep -i "pages" >> docs/manifest.txt || true; else rm -f "docs/$1.pdf"; fi; }
          get odni2021 "https://www.dni.gov/files/ODNI/documents/assessments/Prelimary-Assessment-UAP-20210625.pdf"
          get odni2022 "https://www.dni.gov/files/ODNI/documents/assessments/Unclassified-2022-Annual-Report-UAP.pdf"
          get aaro_hrr1 "https://media.defense.gov/2024/Mar/08/2003409233/-1/-1/0/DOPSR-CLEARED-508-COMPLIANT-HRRV1-08-MAR-2024-FINAL.PDF"
          get aaro_fy23 "https://media.defense.gov/2023/Oct/18/2003322402/-1/-1/0/FY2023-CONSOLIDATED-ANNUAL-REPORT-ON-UAP-508.PDF"
          get aaro_fy24 "https://media.defense.gov/2024/Nov/14/2003583603/-1/-1/0/FY2024-CONSOLIDATED-ANNUAL-REPORT-ON-UAP-508.PDF"
          get nasa2023 "https://smd-cms.nasa.gov/wp-content/uploads/2023/09/uap-independent-study-team-final-report.pdf"
          get fbi_hottel "https://vault.fbi.gov/hottel_guy/Guy%20Hottel%20Part%201%20of%201/at_download/file"
          get cia_robertson "https://www.cia.gov/readingroom/docs/CIA-RDP81R00560R000100030027-0.pdf"
          get cia_chadwell "https://www.cia.gov/readingroom/docs/CIA-RDP81R00560R000100030004-5.pdf"
          get usaf_grudge "https://www.cia.gov/readingroom/docs/CIA-RDP81R00560R000100010001-0.pdf"
          curl -sL -o words.txt https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt; wc -l words.txt >> docs/manifest.txt
          curl -sL -o enable.txt https://raw.githubusercontent.com/dolph/dictionary/master/enable1.txt; wc -l enable.txt >> docs/manifest.txt
          cat docs/manifest.txt
          git init -q . && git checkout -q -b hooked-research-results && git add . && git -c user.name=bot -c user.email=bot@example.com commit -qm "HOOKED docs" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hooked-research-results
