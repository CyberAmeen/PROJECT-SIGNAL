# Research only (HOOKED): find public-domain U.S. government UFO/UAP PDFs on Wikimedia Commons (with licence metadata). Never deploys.
name: prism-research
on: { push: { branches: [prism-research] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          mkdir -p out/docs && cd out
          cat > find.mjs <<'JS'
          const Q = ["Preliminary Assessment Unidentified Aerial Phenomena","Annual Report on Unidentified Aerial Phenomena","Unidentified Anomalous Phenomena annual report","All-domain Anomaly Resolution Office report","Report on the Historical Record of U.S. Government Involvement with Unidentified Anomalous Phenomena","Robertson panel report","Project Blue Book pdf","Project Blue Book report","Project Grudge report","Project Sign report","Hottel memo","Twining memo flying discs","flying saucers FBI","Unidentified flying objects Air Force report pdf","Blue Book Special Report","UAP Independent Study Team","Estimate of the Situation UFO","UFO CIA memorandum","flying saucer memorandum 1952","Unidentified aerial phenomena congressional hearing"];
          const UA = { 'User-Agent': 'ProjectSignalResearch/1.0 (github actions)' }, seen = new Map();
          for (const q of Q) {
            const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&list=search&srnamespace=6&srlimit=20&srsearch=' + encodeURIComponent(q + ' filetype:pdf');
            const j = await (await fetch(u, { headers: UA })).json(); for (const r of (j.query?.search || [])) if (!seen.has(r.title)) seen.set(r.title, q);
          }
          const titles = [...seen.keys()], out = [];
          for (let i = 0; i < titles.length; i += 40) {
            const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url|size|extmetadata|mime&titles=' + encodeURIComponent(titles.slice(i, i + 40).join('|'));
            const j = await (await fetch(u, { headers: UA })).json();
            for (const p of Object.values(j.query.pages)) { const ii = p.imageinfo?.[0]; if (!ii) continue; const m = ii.extmetadata || {};
              out.push({ title: p.title, url: ii.url, page: ii.descriptionurl, size: ii.size, mime: ii.mime, license: m.LicenseShortName?.value, artist: (m.Artist?.value || '').replace(/<[^>]+>/g, '').slice(0, 120), credit: (m.Credit?.value || '').replace(/<[^>]+>/g, '').slice(0, 160), date: (m.DateTimeOriginal?.value || '').replace(/<[^>]+>/g, '').slice(0, 40), q: seen.get(p.title) }); }
          }
          require('fs').writeFileSync('docs/commons.json', JSON.stringify(out, null, 1)); console.log(out.length, 'files');
          JS
          node find.mjs
          node -e '
            const L=require("./docs/commons.json").filter(f=>f.mime==="application/pdf"&&/public domain|PD/i.test(f.license||"")&&f.size<40e6);
            require("fs").writeFileSync("docs/dl.txt",L.map((f,i)=>`d${String(i).padStart(2,"0")}\t${f.url}`).join("\n")); console.log(L.length,"to download")'
          while IFS=$'\t' read -r k u; do curl -sL -A "ProjectSignalResearch/1.0" --max-time 120 -o "docs/$k.pdf" "$u"; if head -c 5 "docs/$k.pdf" | grep -q "%PDF"; then pdftotext -layout "docs/$k.pdf" "docs/$k.txt" 2>/dev/null; echo "$k $(pdfinfo docs/$k.pdf | grep Pages) $(wc -w < docs/$k.txt) words" >> docs/manifest.txt; else rm -f "docs/$k.pdf"; echo "$k FAILED" >> docs/manifest.txt; fi; done < docs/dl.txt
          curl -sL -o docs/nasa2023.pdf https://smd-cms.nasa.gov/wp-content/uploads/2023/09/uap-independent-study-team-final-report.pdf && pdftotext -layout docs/nasa2023.pdf docs/nasa2023.txt
          curl -sL -o enable.txt https://raw.githubusercontent.com/dolph/dictionary/master/enable1.txt
          cat docs/manifest.txt
          git init -q . && git checkout -q -b hooked-research-results && git add . && git -c user.name=bot -c user.email=bot@example.com commit -qm "HOOKED docs" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hooked-research-results
