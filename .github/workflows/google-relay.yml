# Fetches Google News for SENTINEL (Google blocks Cloudflare Workers) and stores the raw feeds in SENTINEL's KV.
# 6 requests per run. To scan Google less often, change the cron below (e.g. "23 * * * *" = hourly).
name: Google News relay

on:
  schedule:
    - cron: "11,41 * * * *"   # every 30 minutes
  workflow_dispatch:
  push:
    branches: ["google-relay"]
    paths: [".github/scripts/google-relay.mjs", ".github/workflows/google-relay.yml"]

concurrency:
  group: google-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github/scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Relay Google News into SENTINEL KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/google-relay.mjs
